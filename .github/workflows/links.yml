name: Link check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tool URLs
        run: python scripts/check_links.py --write data/link-status.json
      - name: Commit updated status
        run: |
          if git diff --quiet -- data/link-status.json; then
            echo "No change in link status."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-status.json
          git commit -m "Update link status"
          git push
